<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101a28;
      color: #ecf4ff;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 44px 22px 64px;
    }

    .eyebrow {
      color: #8ad8df;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    h1 {
      margin: 16px 0;
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1.2;
    }

    p {
      font-size: 17px;
      line-height: 1.7;
      color: #bfd0e5;
    }

    .notice {
      margin: 26px 0;
      padding: 18px;
      border: 1px solid #d07384;
      border-radius: 14px;
      color: #ffe3e8;
      background: #612a3544;
    }

    ul {
      list-style: none;
      display: grid;
      gap: 12px;
      padding: 0;
    }

    li {
      border: 1px solid #51667c;
      border-radius: 14px;
      padding: 17px 19px;
      background: #1a2a3d;
    }

    strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    li span {
      color: #bfd0e5;
    }

    .auth-panel {
      margin: 26px 0;
      padding: 20px;
      border: 1px solid #51667c;
      border-radius: 14px;
      background: #162438;
    }

    .auth-panel h2 {
      margin: 0 0 14px;
      font-size: 21px;
    }

    .auth-form {
      display: grid;
      gap: 10px;
    }

    .auth-form[hidden] {
      display: none;
    }

    .auth-form input,
    .auth-form button {
      box-sizing: border-box;
      width: 100%;
      border-radius: 10px;
      padding: 12px 14px;
      font: inherit;
    }

    .auth-form input {
      border: 1px solid #51667c;
      background: #0f1a29;
      color: #ecf4ff;
    }

    .auth-form button {
      border: 0;
      background: #8ad8df;
      color: #10202d;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-form button:disabled,
    .secondary-button:disabled {
      cursor: wait;
      opacity: .65;
    }

    .secondary-button {
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      padding: 12px 14px;
      width: 100%;
      background: #8ad8df;
      color: #10202d;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-status {
      margin: 12px 0 0;
      font-size: 14px;
      min-height: 1.5em;
    }

    .auth-error {
      color: #ffb7c2;
    }

    .auth-success {
      color: #9ee6c2;
    }
  </style>
</head>

<body>

  <main>
    <div class="eyebrow">BYTE BACK · 3단계 진짜 로그인</div>

    <h1>점령된 자료실</h1>

    <p>
      자료는 공개 정적 파일이 아니라 서버 API를 통해 불러옵니다.
      아래 기록은 모두 실습을 위해 만든 가상 자료입니다.
    </p>

    <section class="auth-panel" aria-labelledby="auth-title">
      <h2 id="auth-title">자료실 로그인</h2>

      <form id="login-form" class="auth-form">
        <input id="email" name="email" type="email" autocomplete="email" placeholder="이메일" required>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
        <button id="login-button" type="submit">로그인</button>
      </form>

      <button id="logout-button" class="secondary-button" type="button" hidden>로그아웃</button>
      <p id="auth-status" class="auth-status" aria-live="polite"></p>
    </section>

    <div class="notice">
      현재 단계에서는 로그인 상태만 확인합니다.
      자료 API의 접근 제어는 다음 단계에서 추가합니다.
    </div>

    <ul id="notes" aria-live="polite">
      <li>가상 자료를 불러오는 중입니다.</li>
    </ul>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.117.2';

    const SUPABASE_URL = 'https://vkvajtqxmznshbwgoxiy.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_kC7YFa2hjiLKBBcuogdroA_1dO7DkiV';

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const form = document.querySelector('#login-form');
    const emailInput = document.querySelector('#email');
    const passwordInput = document.querySelector('#password');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const status = document.querySelector('#auth-status');
    const list = document.querySelector('#notes');

    function showStatus(message, type = '') {
      status.textContent = message;
      status.className = 'auth-status ' + type;
    }

    function showLoggedOut() {
      form.hidden = false;
      logoutButton.hidden = true;
      showStatus('로그인하지 않은 상태입니다.');
    }

    function showLoggedIn(email) {
      form.hidden = true;
      logoutButton.hidden = false;
      showStatus('로그인됨: ' + email, 'auth-success');
    }

    function explainAuthError(error) {
      const message = error?.message || '알 수 없는 로그인 오류가 발생했습니다.';
      return '로그인 실패: ' + message;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();

      loginButton.disabled = true;
      showStatus('로그인 중입니다.');

      const { data, error } = await supabase.auth.signInWithPassword({
        email: emailInput.value.trim(),
        password: passwordInput.value
      });

      loginButton.disabled = false;

      if (error) {
        showStatus(explainAuthError(error), 'auth-error');
        return;
      }

      if (!data.user) {
        showStatus('로그인 실패: 사용자 정보를 확인할 수 없습니다.', 'auth-error');
        return;
      }

      passwordInput.value = '';
      showLoggedIn(data.user.email);
    });

    logoutButton.addEventListener('click', async () => {
      logoutButton.disabled = true;
      showStatus('로그아웃 중입니다.');

      const { error } = await supabase.auth.signOut();

      logoutButton.disabled = false;

      if (error) {
        showStatus('로그아웃 실패: ' + error.message, 'auth-error');
        return;
      }

      showLoggedOut();
    });

    async function loadNotes(session) {
      if (!session?.access_token) {
        list.replaceChildren();
        return;
      }

      try {
        const response = await fetch('/api/notes', {
          cache: 'no-store',
          headers: { Authorization: 'Bearer ' + session.access_token },
        });

        const body = await response.json();
        if (!response.ok) {
          throw new Error(`자료 API 오류 (${response.status}): ${body.error || 'UNKNOWN_ERROR'}${body.debug ? ' / ' + body.debug : ''}`);
        }

        const data = body;

        if (!Array.isArray(data.notes)) {
          throw new Error('자료 형식이 맞지 않습니다.');
        }

        list.replaceChildren(
          ...data.notes.map(note => {
            const item = document.createElement('li');

            const title = document.createElement('strong');
            const content = document.createElement('span');

            title.textContent = note.title;
            content.textContent = note.content;

            item.append(title, content);

            return item;
          })
        );
      } catch (error) {
        const item = document.createElement('li');
        item.textContent = error.message;
        list.replaceChildren(item);
      }
    }

    supabase.auth.onAuthStateChange((_event, session) => {
      if (session?.user) {
        showLoggedIn(session.user.email);
        loadNotes(session);
      } else {
        showLoggedOut();
        list.replaceChildren();
      }
    });

    const { data: { session } } = await supabase.auth.getSession();
    if (session?.user) {
      showLoggedIn(session.user.email);
      await loadNotes(session);
    } else {
      showLoggedOut();
      list.replaceChildren();
    }
  </script>

</body>
</html>
