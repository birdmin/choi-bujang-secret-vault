<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101a28;
      color: #ecf4ff;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 44px 22px 64px;
    }

    .eyebrow {
      color: #8ad8df;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    h1 {
      margin: 16px 0;
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1.2;
    }

    p {
      font-size: 17px;
      line-height: 1.7;
      color: #bfd0e5;
    }

    .notice {
      margin: 26px 0;
      padding: 18px;
      border: 1px solid #d07384;
      border-radius: 14px;
      color: #ffe3e8;
      background: #612a3544;
    }

    ul {
      list-style: none;
      display: grid;
      gap: 12px;
      padding: 0;
    }

    li {
      border: 1px solid #51667c;
      border-radius: 14px;
      padding: 17px 19px;
      background: #1a2a3d;
    }

    strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    li span {
      color: #bfd0e5;
    }

    .auth-panel {
      margin: 26px 0;
      padding: 20px;
      border: 1px solid #51667c;
      border-radius: 14px;
      background: #162438;
    }

    .auth-panel h2 {
      margin: 0 0 14px;
      font-size: 21px;
    }

    .auth-form {
      display: grid;
      gap: 10px;
    }

    .auth-form[hidden] {
      display: none;
    }

    .auth-form input,
    .auth-form button {
      box-sizing: border-box;
      width: 100%;
      border-radius: 10px;
      padding: 12px 14px;
      font: inherit;
    }

    .auth-form input {
      border: 1px solid #51667c;
      background: #0f1a29;
      color: #ecf4ff;
    }

    .auth-form button {
      border: 0;
      background: #8ad8df;
      color: #10202d;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-form button:disabled,
    .secondary-button:disabled {
      cursor: wait;
      opacity: .65;
    }

    .secondary-button {
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      padding: 12px 14px;
      width: 100%;
      background: #8ad8df;
      color: #10202d;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-status {
      margin: 12px 0 0;
      font-size: 14px;
      min-height: 1.5em;
    }

    .auth-error {
      color: #ffb7c2;
    }

    .auth-success {
      color: #9ee6c2;
    }
  </style>
</head>

<body>

  <main>
    <div class="eyebrow">BYTE BACK · 3단계 진짜 로그인</div>

    <h1>점령된 자료실</h1>

    <p>
      자료는 공개 정적 파일이 아니라 서버 API를 통해 불러옵니다.
      아래 기록은 모두 실습을 위해 만든 가상 자료입니다.
    </p>

    <section class="auth-panel" aria-labelledby="auth-title">
      <h2 id="auth-title">자료실 로그인</h2>

      <form id="login-form" class="auth-form">
        <input id="email" name="email" type="email" autocomplete="email" placeholder="이메일" required>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
        <button id="login-button" type="submit">로그인</button>
      </form>

      <button id="logout-button" class="secondary-button" type="button" hidden>로그아웃</button>
      <p id="auth-status" class="auth-status" aria-live="polite"></p>
    </section>

    <section id="memo-panel" class="memo-panel" aria-labelledby="memo-title" hidden>
      <h2 id="memo-title">내 가상 메모</h2>

      <form id="memo-form" class="memo-form">
        <input id="memo-id" type="hidden">
        <input id="memo-title" type="text" placeholder="메모 제목" required>
        <textarea id="memo-body" placeholder="메모 내용" required></textarea>
        <button id="memo-submit" type="submit">메모 추가</button>
        <button id="memo-cancel" type="button" hidden>수정 취소</button>
      </form>

      <p id="memo-status" class="auth-status" aria-live="polite"></p>
      <ul id="memos" aria-live="polite"></ul>
    </section>

    <div class="notice">
      현재 단계에서는 로그인 상태만 확인합니다.
      자료 API의 접근 제어는 다음 단계에서 추가합니다.
    </div>

    <ul id="notes" aria-live="polite">
      <li>가상 자료를 불러오는 중입니다.</li>
    </ul>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.117.2';

    const SUPABASE_URL = 'https://vkvajtqxmznshbwgoxiy.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_kC7YFa2hjiLKBBcuogdroA_1dO7DkiV';

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const form = document.querySelector('#login-form');
    const emailInput = document.querySelector('#email');
    const passwordInput = document.querySelector('#password');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const status = document.querySelector('#auth-status');
    const list = document.querySelector('#notes');

    function showStatus(message, type = '') {
      status.textContent = message;
      status.className = 'auth-status ' + type;
    }

    function showLoggedOut() {
      form.hidden = false;
      logoutButton.hidden = true;
      showStatus('로그인하지 않은 상태입니다.');
    }

    function showLoggedIn(email) {
      form.hidden = true;
      logoutButton.hidden = false;
      showStatus('로그인됨: ' + email, 'auth-success');
    }

    function explainAuthError(error) {
      const message = error?.message || '알 수 없는 로그인 오류가 발생했습니다.';
      return '로그인 실패: ' + message;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();

      loginButton.disabled = true;
      showStatus('로그인 중입니다.');

      const { data, error } = await supabase.auth.signInWithPassword({
        email: emailInput.value.trim(),
        password: passwordInput.value
      });

      loginButton.disabled = false;

      if (error) {
        showStatus(explainAuthError(error), 'auth-error');
        return;
      }

      if (!data.user) {
        showStatus('로그인 실패: 사용자 정보를 확인할 수 없습니다.', 'auth-error');
        return;
      }

      passwordInput.value = '';
      showLoggedIn(data.user.email);
    });

    logoutButton.addEventListener('click', async () => {
      logoutButton.disabled = true;
      showStatus('로그아웃 중입니다.');

      const { error } = await supabase.auth.signOut();

      logoutButton.disabled = false;

      if (error) {
        showStatus('로그아웃 실패: ' + error.message, 'auth-error');
        return;
      }

      showLoggedOut();
    });

    const memoPanel = document.querySelector('#memo-panel');
    const memoForm = document.querySelector('#memo-form');
    const memoIdInput = document.querySelector('#memo-id');
    const memoTitleInput = document.querySelector('#memo-title');
    const memoBodyInput = document.querySelector('#memo-body');
    const memoSubmit = document.querySelector('#memo-submit');
    const memoCancel = document.querySelector('#memo-cancel');
    const memoStatus = document.querySelector('#memo-status');
    const memoList = document.querySelector('#memos');

    let currentSession = null;

    function showMemoStatus(message, type = '') {
      memoStatus.textContent = message;
      memoStatus.className = 'auth-status ' + type;
    }

    function memoHeaders() {
      return {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + currentSession.access_token
      };
    }

    function resetMemoForm() {
      memoIdInput.value = '';
      memoTitleInput.value = '';
      memoBodyInput.value = '';
      memoSubmit.textContent = '메모 추가';
      memoCancel.hidden = true;
    }

    function renderMemos(memos) {
      memoList.replaceChildren();

      if (!memos.length) {
        const empty = document.createElement('li');
        empty.textContent = '저장된 메모가 없습니다.';
        memoList.append(empty);
        return;
      }

      for (const memo of memos) {
        const item = document.createElement('li');
        const title = document.createElement('strong');
        const body = document.createElement('span');
        const actions = document.createElement('div');

        title.textContent = memo.title;
        body.textContent = memo.body;
        actions.className = 'memo-actions';

        const edit = document.createElement('button');
        edit.textContent = '수정';
        edit.addEventListener('click', () => {
          memoIdInput.value = memo.id;
          memoTitleInput.value = memo.title;
          memoBodyInput.value = memo.body;
          memoSubmit.textContent = '메모 수정';
          memoCancel.hidden = false;
          memoTitleInput.focus();
        });

        const remove = document.createElement('button');
        remove.textContent = '삭제';
        remove.addEventListener('click', async () => {
          if (!confirm('이 메모를 삭제할까요?')) return;

          const response = await fetch('/api/memos/' + encodeURIComponent(memo.id), {
            method: 'DELETE',
            headers: { Authorization: 'Bearer ' + currentSession.access_token }
          });

          if (!response.ok) {
            showMemoStatus('삭제 실패: ' + response.status, 'auth-error');
            return;
          }

          showMemoStatus('메모를 삭제했습니다.', 'auth-success');
          resetMemoForm();
          await loadMemos();
        });

        actions.append(edit, remove);
        item.append(title, body, actions);
        memoList.append(item);
      }
    }

    async function loadMemos() {
      if (!currentSession?.access_token) {
        memoPanel.hidden = true;
        memoList.replaceChildren();
        return;
      }

      memoPanel.hidden = false;

      try {
        const response = await fetch('/api/memos', {
          cache: 'no-store',
          headers: { Authorization: 'Bearer ' + currentSession.access_token }
        });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'MEMOS_FETCH_FAILED');
        }

        renderMemos(Array.isArray(data.memos) ? data.memos : []);
      } catch (error) {
        showMemoStatus('메모 불러오기 실패: ' + error.message, 'auth-error');
      }
    }

    memoForm.addEventListener('submit', async event => {
      event.preventDefault();

      if (!currentSession?.access_token) return;

      memoSubmit.disabled = true;

      try {
        const id = memoIdInput.value.trim();
        const payload = {
          title: memoTitleInput.value.trim(),
          body: memoBodyInput.value
        };

        let response;

        if (id) {
          response = await fetch('/api/memos/' + encodeURIComponent(id), {
            method: 'PUT',
            headers: memoHeaders(),
            body: JSON.stringify(payload)
          });
        } else {
          response = await fetch('/api/memos', {
            method: 'POST',
            headers: memoHeaders(),
            body: JSON.stringify(payload)
          });
        }

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || 'MEMO_SAVE_FAILED');
        }

        showMemoStatus(id ? '메모를 수정했습니다.' : '메모를 추가했습니다.', 'auth-success');
        resetMemoForm();
        await loadMemos();
      } catch (error) {
        showMemoStatus('저장 실패: ' + error.message, 'auth-error');
      } finally {
        memoSubmit.disabled = false;
      }
    });

    memoCancel.addEventListener('click', () => {
      resetMemoForm();
      showMemoStatus('');
    });

    supabase.auth.onAuthStateChange((_event, session) => {
      currentSession = session;

      if (session?.user) {
        showLoggedIn(session.user.email);
        loadNotes(session);
        loadMemos();
      } else {
        showLoggedOut();
        list.replaceChildren();
        resetMemoForm();
        memoPanel.hidden = true;
        memoList.replaceChildren();
      }
    });

    async function loadNotes(session) {
      if (!session?.access_token) {
        list.replaceChildren();
        return;
      }

      try {
        const response = await fetch('/api/notes', {
          cache: 'no-store',
          headers: { Authorization: 'Bearer ' + session.access_token }
        });
        const body = await response.json();

        if (!response.ok) {
          throw new Error(body.error || 'NOTES_FETCH_FAILED');
        }

        if (!Array.isArray(body.notes)) {
          throw new Error('자료 형식이 맞지 않습니다.');
        }

        list.replaceChildren(
          ...body.notes.map(note => {
            const item = document.createElement('li');
            const title = document.createElement('strong');
            const content = document.createElement('span');
            title.textContent = note.title;
            content.textContent = note.content;
            item.append(title, content);
            return item;
          })
        );
      } catch (error) {
        const item = document.createElement('li');
        item.textContent = '자료를 불러오지 못했습니다.';
        list.replaceChildren(item);
      }
    }

    supabase.auth.onAuthStateChange((_event, session) => {
      if (session?.user) {
        showLoggedIn(session.user.email);
        loadNotes(session);
      } else {
        showLoggedOut();
        list.replaceChildren();
      }
    });

    const { data: { session } } = await supabase.auth.getSession();
    if (session?.user) {
      showLoggedIn(session.user.email);
      await loadNotes(session);
    } else {
      showLoggedOut();
      list.replaceChildren();
    }
  </script>

</body>
</html>
