name: stage2-bundle-check
# Triggered for stage 2 verification

on:
  push:
    branches: [main]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stage 2 save point
        uses: actions/checkout@v4
        with:
          ref: 6523e35a7e0bd13df4c510417ec67ff5a9b02764
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run bundle
        run: npm run bundle
      - name: Upload submission
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-submission
          path: artifacts/submission.json
          if-no-files-found: ignore
