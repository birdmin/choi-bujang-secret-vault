name: XDR Web Injection Checkpoint

on:
  push:
    branches: [main]
    paths:
      - 'xdr/web-injection/**'
      - 'xdr/fixtures/web-injection.json'
      - 'scripts/xdr-run.mjs'
      - 'package.json'
      - '.github/workflows/xdr-web-injection-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-and-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run web-injection XDR fixture
        run: npm run xdr:run -- web-injection

      - name: Show counts and check normal alerts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const fixture = JSON.parse(readFileSync('xdr/fixtures/web-injection.json', 'utf8'));
          const result = JSON.parse(readFileSync('xdr/web-injection/result.json', 'utf8'));
          const counts = result.counts;
          for (const key of ['block', 'alert', 'record']) {
            if (!Number.isInteger(counts?.[key]) || counts[key] < 0) {
              throw new Error(`invalid_count_${key}`);
            }
          }
          const byId = new Map(fixture.alerts.map(alert => [alert.id, alert]));
          const normalTerms = /정상|수업명|수업 단어|공격 표기는 없습니다|반복은 없습니다|삽입 표식은 아닙니다/i;
          const blockedNormal = result.decisions.filter(decision =>
            decision.action === 'block' && normalTerms.test(byId.get(decision.alertId)?.rule?.description ?? '')
          );
          console.log(`block=${counts.block} alert=${counts.alert} record=${counts.record}`);
          console.log(`blocked_normal_count=${blockedNormal.length}`);
          if (blockedNormal.length) {
            console.log('blocked_normal_ids=' + blockedNormal.map(item => item.alertId).join(','));
            throw new Error('normal_event_blocked');
          }
          NODE

      - name: Commit result checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add xdr/web-injection/result.json
          if git diff --cached --quiet; then
            echo "result.json is unchanged; create the requested checkpoint commit."
            git commit --allow-empty -m "보너스 xdr-02 저장점"
            git push origin HEAD:main
          else
            git commit -m "보너스 xdr-02 저장점"
            git push origin HEAD:main
          fi
