name: Stage 3 bundle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  STAGE_3_CHECKPOINT: 53fbde29afc4868b6bfb3c364110c30a30045f8a

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stage 3 checkpoint
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STAGE_3_CHECKPOINT }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Run submission bundle
        run: npm run bundle

      - name: Show submission JSON
        run: cat artifacts/submission.json

      - name: Upload submission bundle
        uses: actions/upload-artifact@v4
        with:
          name: stage-3-submission
          path: artifacts/submission.json
          if-no-files-found: error
