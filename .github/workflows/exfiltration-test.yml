name: Exfiltration XDR practice test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exfiltration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Run exfiltration fixture
        run: npm run xdr:run -- exfiltration
      - name: Check result counts and normal events
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const result = JSON.parse(await readFile('xdr/exfiltration/result.json', 'utf8'));
          if (result.moduleKey !== 'exfiltration') throw new Error('잘못된 모듈 결과');
          if (result.decisions.length !== 30) throw new Error('경보 30건을 모두 처리하지 못했습니다.');
          const mustBlock = new Set(['ex-01', 'ex-02', 'ex-03', 'ex-04', 'ex-05', 'ex-07', 'ex-09', 'ex-10']);
          const blocked = new Set(result.decisions.filter((item) => item.action === 'block').map((item) => item.alertId));
          const missed = [...mustBlock].filter((id) => !blocked.has(id));
          if (missed.length) throw new Error('명확한 공격이 block 되지 않음: ' + missed.join(', '));
          const normalIds = new Set(['ex-21', 'ex-22', 'ex-23', 'ex-24', 'ex-25', 'ex-26', 'ex-27', 'ex-28', 'ex-29', 'ex-30']);
          const blockedNormal = result.decisions.filter((item) => normalIds.has(item.alertId) && item.action === 'block');
          if (blockedNormal.length) throw new Error('정상 이벤트 차단: ' + JSON.stringify(blockedNormal));
          console.log(JSON.stringify({
            processed: result.decisions.length,
            counts: result.counts,
            requiredAttacksBlocked: mustBlock.size,
            blockedNormalEvents: blockedNormal.length
          }, null, 2));
          NODE
      - name: Test temporary deny candidates and audit log
        run: |
          node --input-type=module <<'NODE'
          import { readFile, rm } from 'node:fs/promises';
          import { respond, ALERT_LOG_PATH } from './xdr/exfiltration/respond.mjs';
          const fixture = JSON.parse(await readFile('xdr/fixtures/exfiltration.json', 'utf8'));
          await rm(ALERT_LOG_PATH, { force: true });
          const outcomes = [];
          for (const alert of fixture.alerts) {
            outcomes.push({ id: alert.id, ...(await respond(alert, { now: Date.parse('2026-10-16T00:00:00Z') })) });
          }
          const normalIds = new Set(['ex-21', 'ex-22', 'ex-23', 'ex-24', 'ex-25', 'ex-26', 'ex-27', 'ex-28', 'ex-29', 'ex-30']);
          const normalCandidates = outcomes.filter((item) => normalIds.has(item.id) && item.denyRule);
          if (normalCandidates.length) throw new Error('정상 이벤트에 차단 후보 생성: ' + JSON.stringify(normalCandidates.map((item) => item.id)));
          const candidates = outcomes.filter((item) => item.denyRule);
          if (candidates.some((item) => item.action !== 'block' || item.confidence < 0.85)) {
            throw new Error('차단 외 판정에서 deny 후보가 생성됨');
          }
          if (candidates.some((item) => !item.denyRule.expiresAt || !item.denyRule.evidenceAlertId)) {
            throw new Error('차단 후보에 만료 시각 또는 근거 경보 번호가 없음');
          }
          const lines = (await readFile(ALERT_LOG_PATH, 'utf8')).trim().split('\n');
          if (lines.length !== fixture.alerts.length) throw new Error('감사 로그 줄 수가 경보 수와 다름');
          console.log(JSON.stringify({
            processed: outcomes.length,
            denyCandidates: candidates.length,
            normalDenyCandidates: normalCandidates.length,
            auditLogLines: lines.length
          }, null, 2));
          NODE
      - name: Show complete decision result
        run: cat xdr/exfiltration/result.json
