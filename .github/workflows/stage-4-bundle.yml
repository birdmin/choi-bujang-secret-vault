name: Stage 4 bundle
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  STAGE_4_CHECKPOINT: ce43fe1c6eae94114d0e77c5a460303aa5ff9993
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stage 4 checkpoint
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STAGE_4_CHECKPOINT }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Prepare stage 4 bundle notes
        run: |
          cat > /tmp/stage-4-bundle-notes.json <<'EOF'
          {
            "explanation": "4단계에서는 로그인한 사용자의 검증된 ID를 메모 소유자로 사용하고, 메모 상세·수정·삭제 API에서 대상 메모의 owner_id를 확인하도록 했습니다. 메모 목록·추가 API는 이미 검증된 사용자 ID로 범위를 제한하며, public.memos에는 authenticated 전용 테이블 권한과 auth.uid() = owner_id RLS 정책을 적용했습니다. 제출 점검에서는 비로그인 메모 API의 JSON 401/403 차단, 배포된 aleph.json, 첫 화면의 nosniff 헤더를 확인합니다.",
            "blockedAt": null
          }
          EOF
      - name: Run submission bundle
        env:
          BUNDLE_NOTES_PATH: /tmp/stage-4-bundle-notes.json
        run: npm run bundle
      - name: Show submission JSON
        run: cat artifacts/submission.json
      - name: Upload submission bundle
        uses: actions/upload-artifact@v4
        with:
          name: stage-4-submission
          path: artifacts/submission.json
          if-no-files-found: error
